{% extends "base.html" %}
{% block content %}
    <form class="card stack form-card" method="post">
        {% csrf_token %}
        {% include "includes/form_errors.html" %}
        {% include "includes/field.html" with field=form.name %}
        <div class="actions">
            <button class="btn btn-primary save-button" type="submit">Сохранить</button>
            <a class="btn btn-secondary cancel-button"
               href="{% url 'academics:references' %}">
                Отмена
            </a>
        </div>
    </form>
{% endblock %}
