{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="referrer"
              content="{% block referrer_policy %}same-origin{% endblock %}">
        <noscript>
            <meta name="referrer" content="same-origin">
        </noscript>
        <title>
            {% block title %}
                {{ page_title }}
            {% endblock %}
            - Учебный кабинет
        </title>
        <link rel="stylesheet" href="{% static 'css/app.css' %}">
        <script defer src="{% static 'js/app.js' %}"></script>
    </head>
    <body data-role="{{ request.user.role }}"
          class="{% block body_class %}{% endblock %}">
        {% block body %}{% endblock %}
    </body>
</html>
