<div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}" id="{{ field.auto_id }}_label">
        {{ field.label }}
        {% if field.field.required %}
            <span aria-hidden="true">*</span>
        {% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <p class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <div class="field-error" id="{{ field.auto_id }}_error" role="alert">
            {% for error in field.errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
</div>
