{% extends "base.html" %}
{% block content %}
    <section class="card stack form-card">
        <h2>{{ confirmation_title }}</h2>
        <p>{{ confirmation_description }}</p>
        {% if protected_error %}
            <p class="notice notice-error" role="alert">{{ protected_error }}</p>
        {% endif %}
        <form class="actions" method="post">
            {% csrf_token %}
            <a class="btn btn-secondary" href="{{ cancel_url }}">Отмена</a>
            <button class="btn btn-danger" type="submit">Удалить</button>
        </form>
    </section>
{% endblock %}
